<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>NOCTIS - 月相命運核對終端</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+TC:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --purple: #b86bff; --bg: #0a0a0a; }
        body { background: var(--bg); color: #fff; font-family: 'Noto Sans TC', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        
        .checker-card {
            max-width: 520px; width: 100%; background: #161616; padding: 40px; 
            border-radius: 12px; border: 1px solid rgba(212, 175, 55, 0.3);
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .logo { font-family: 'Cinzel', serif; color: var(--gold); font-size: 2.5rem; letter-spacing: 5px; margin-bottom: 10px; }
        .subtitle { color: #888; font-size: 0.9rem; letter-spacing: 2px; margin-bottom: 8px; }
        .subtitle-hint { color: #555; font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 30px; }

        /* Serial 輸入框 */
        .serial-wrapper { margin-bottom: 24px; }
        .serial-input {
            width: 100%; box-sizing: border-box;
            background: #000; border: 1px solid #333; color: #fff;
            height: 60px; font-size: 1.4rem; border-radius: 8px;
            text-align: center; letter-spacing: 4px;
            font-family: 'Courier New', monospace; transition: 0.3s;
            padding: 0 16px;
        }
        .serial-input:focus { border-color: var(--purple); box-shadow: 0 0 15px rgba(184, 107, 255, 0.3); outline: none; }
        .serial-input::placeholder { color: #333; font-size: 1rem; letter-spacing: 2px; }

        .check-btn {
            width: 100%; padding: 18px; background: var(--gold); color: #000; 
            font-weight: bold; border: none; cursor: pointer; border-radius: 8px;
            font-family: 'Cinzel'; font-size: 1.1rem; transition: 0.3s;
        }
        .check-btn:hover { background: #fff; transform: translateY(-3px); }
        .check-btn:disabled { background: #555 !important; color: #888 !important; cursor: not-allowed; transform: none !important; }

        /* 結果區 */
        #result-area { margin-top: 30px; display: none; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .result-header {
            padding: 16px 20px; border-radius: 8px 8px 0 0;
            background: rgba(0,0,0,0.4); border: 1px solid #333;
            border-bottom: none;
        }
        .result-serial { font-size: 0.75rem; color: #555; letter-spacing: 3px; margin-bottom: 4px; }
        .result-buyer { font-size: 1rem; color: #aaa; letter-spacing: 2px; }

        /* 每注結果卡片 */
        .bet-list { display: flex; flex-direction: column; gap: 0; }
        .bet-item {
            padding: 16px 20px;
            background: rgba(0,0,0,0.3);
            border: 1px solid #222;
            border-top: none;
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px;
        }
        .bet-item:last-child { border-radius: 0 0 8px 8px; }

        .bet-nums { display: flex; gap: 6px; flex-wrap: wrap; }
        .num-ball {
            width: 32px; height: 32px; border-radius: 50%;
            background: #1a1a1a; border: 1px solid #333;
            font-size: 0.8rem; font-family: 'Courier New', monospace;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .num-ball.hit { background: rgba(184,107,255,0.2); border-color: var(--purple); color: var(--purple); }
        .num-ball.special { background: rgba(212,175,55,0.2); border-color: var(--gold); color: var(--gold); }

        .bet-prize { text-align: right; flex-shrink: 0; }
        .bet-prize-name { font-size: 0.85rem; font-family: 'Cinzel'; margin-bottom: 2px; }
        .bet-prize-amount { font-size: 0.75rem; color: #888; }
        .bet-no-prize { font-size: 0.8rem; color: #444; }

        /* 總計區 */
        .result-summary {
            margin-top: 16px; padding: 18px 20px;
            background: rgba(0,0,0,0.4); border-radius: 8px;
            border: 1px solid rgba(212,175,55,0.2);
            display: flex; align-items: center; justify-content: space-between;
        }
        .summary-label { font-size: 0.8rem; color: #888; letter-spacing: 2px; }
        .summary-amount { font-size: 1.3rem; font-family: 'Cinzel'; color: var(--gold); }

        .loading-msg { color: var(--gold); padding: 20px; }
    </style>
</head>
<body>

<div class="checker-card">
    <div class="logo">NOCTIS</div>
    <div class="subtitle">月相觀測自助核對系統</div>
    <div class="subtitle-hint">請輸入票根右下方的 SERIAL NUMBER<br>格式：NX-XXXXXXXXX</div>

    <div class="serial-wrapper">
        <input type="text" class="serial-input" id="serialInput" placeholder="輸入 SERIAL NUMBER" maxlength="20">
    </div>

    <button class="check-btn" onclick="runCheck()">揭曉觀測結果 (REVEAL FATE)</button>

    <div id="result-area"></div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwudPjnrQzKMKsIHrvm0boqptRyVSfoZDF0aGbZw4ksZqknpuxfYDGCD4AyRMEb21TdhQ/exec";

// Enter 鍵直接查詢
document.getElementById('serialInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') runCheck();
});

async function runCheck() {
    const btn = document.querySelector('.check-btn');
    const serial = document.getElementById('serialInput').value.trim();
    const resArea = document.getElementById('result-area');

    if (!serial) {
        alert("請輸入 Serial Number");
        return;
    }

    btn.disabled = true;
    const originalText = btn.innerText;
    btn.innerText = "觀測中 (OBSERVING...)";
    resArea.style.display = 'block';
    resArea.innerHTML = `<div class="loading-msg">正在同步月相檔案...</div>`;

    try {
        const response = await fetch(`${GAS_URL}?action=checkSerial&serial=${encodeURIComponent(serial)}`);
        const data = await response.json();

        if (data.status === 'not_found') {
            resArea.innerHTML = `<div style="padding:20px; color:#ff4d4d; border:1px solid #ff4d4d33; border-radius:8px;">找不到此 Serial Number，請確認票根號碼。</div>`;
            return;
        }

        if (data.status === 'no_result') {
            resArea.innerHTML = `<div style="padding:20px; color:#888; border:1px solid #333; border-radius:8px;">本期尚未開獎，請等待月相揭曉。</div>`;
            return;
        }

        renderResult(data, serial);

    } catch (e) {
        resArea.innerHTML = `<div style="padding:20px; color:#ff4d4d;">連線失敗，請聯繫櫃檯職員。</div>`;
    } finally {
        btn.disabled = false;
        btn.innerText = originalText;
    }
}

function renderResult(data, serial) {
    const resArea = document.getElementById('result-area');
    const winningNums = data.winningNums; // array of padded strings
    const specialNum = data.specialNum;
    const bets = data.bets; // array of { nums: [...], prize, amount }

    let totalAmount = 0;

    // 建立每注 HTML
    const betItems = bets.map((bet, i) => {
        const balls = bet.nums.map(n => {
            const isHit = winningNums.includes(n);
            const isSpecial = n === specialNum && !isHit; // 特別號但非正字
            const cls = isHit ? 'hit' : (isSpecial ? 'special' : '');
            return `<div class="num-ball ${cls}">${n}</div>`;
        }).join('');

        let prizeHtml = '';
        if (bet.prize) {
            totalAmount += bet.amountNum || 0;
            prizeHtml = `
                <div class="bet-prize">
                    <div class="bet-prize-name" style="color:${bet.color}">${bet.prize}</div>
                    <div class="bet-prize-amount">${bet.amount}</div>
                </div>`;
        } else {
            prizeHtml = `<div class="bet-no-prize">未中獎</div>`;
        }

        return `
            <div class="bet-item">
                <div class="bet-nums">${balls}</div>
                ${prizeHtml}
            </div>`;
    }).join('');

    const summaryHtml = totalAmount > 0
        ? `<div class="result-summary">
               <div class="summary-label">本票根合計獎金</div>
               <div class="summary-amount">${totalAmount.toLocaleString()} Gil</div>
           </div>`
        : '';

    resArea.innerHTML = `
        <div class="result-header">
            <div class="result-serial">SERIAL : ${serial}</div>
            <div class="result-buyer">${data.buyer || ''}</div>
        </div>
        <div class="bet-list">${betItems}</div>
        ${summaryHtml}
    `;
}
</script>
</body>
</html>
